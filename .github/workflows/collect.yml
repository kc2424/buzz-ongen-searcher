name: 毎日チャートを収集

on:
  schedule:
    # 22:00 UTC = 翌 07:00 JST（GitHub側の混雑で数十分ずれることがある）
    - cron: "0 22 * * *"
  workflow_dispatch:   # 手動でも実行できるようにしておく

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 収集を実行
        run: python collect.py

      - name: 変化があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "変化なし。コミットしません。"
          else
            git commit -m "chart: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
